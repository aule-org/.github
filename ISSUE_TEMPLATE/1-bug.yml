name: Bug report
description: Something does not work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include device IDs, MAC addresses, tokens, Wi-Fi details or recordings of children.
  - type: input
    id: version
    attributes:
      label: Version, commit or hardware revision
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: extra
    attributes:
      label: Logs, photos or measurements
